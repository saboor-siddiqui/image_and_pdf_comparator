<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and HTML Comparison</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .form-container { display: none; }
        .comparison-options { margin-bottom: 20px; }
        .btn { margin: 5px; }
        .preview-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .preview-box {
            flex: 1;
            border: 2px dashed #ccc;
            padding: 10px;
            text-align: center;
            position: relative;
        }
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            display: none;
        }
        .upload-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: #666;
            pointer-events: none;
            opacity: 0.7;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar .progress {
            width: 0;
            height: 100%;
            background: #007bff;
            transition: width 0.3s ease;
        }
        .loading-bar .percentage {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="comparison-options">
            <h1>Select Comparison Type</h1>
            <button class="btn btn-primary" onclick="showForm('single-comparison')">Image to Image Comparison</button>
            <button class="btn btn-primary" onclick="showForm('html-comparison')">HTML to HTML Comparison</button>
        </div>

        <div id="forms-container">
            <div id="single-comparison" class="form-container">
                <h2>Image to Image Comparison</h2>
                <form id="single-form" action="/" method="post" enctype="multipart/form-data" onsubmit="showLoadingOverlay()">
                    <div class="preview-container">
                        <div class="preview-box">
                            <label for="file1">Image 1</label>
                            <div class="upload-prompt">Drag & Drop here or click to upload</div>
                            <input type="file" name="file1" id="file1" accept="image/*" required>
                            <div class="file-info" id="info1"></div>
                            <img id="preview1" class="preview-image" alt="Preview 1">
                        </div>
                        <div class="preview-box">
                            <label for="file2">Image 2</label>
                            <div class="upload-prompt">Drag & Drop here or click to upload</div>
                            <input type="file" name="file2" id="file2" accept="image/*" required>
                            <div class="file-info" id="info2"></div>
                            <img id="preview2" class="preview-image" alt="Preview 2">
                        </div>
                    </div>
                    <button type="submit" class="btn">Compare</button>
                </form>
            </div>

            <div id="html-comparison" class="form-container">
                <h2>HTML to HTML Comparison</h2>
                <form action="/" method="post" enctype="multipart/form-data" onsubmit="showLoadingOverlay()">
                    <div class="preview-container">
                        <div class="preview-box">
                            <label for="html_file1">HTML File 1</label>
                            <div class="upload-prompt">Drag & Drop here or click to upload</div>
                            <input type="file" name="html_file1" id="html_file1" accept=".html,text/html" required>
                            <div class="file-info" id="info-html1"></div>
                        </div>
                        <div class="preview-box">
                            <label for="html_file2">HTML File 2</label>
                            <div class="upload-prompt">Drag & Drop here or click to upload</div>
                            <input type="file" name="html_file2" id="html_file2" accept=".html,text/html" required>
                            <div class="file-info" id="info-html2"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn">Compare HTML Files</button>
                </form>
            </div>
        </div>

        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-bar">
                <div class="progress" id="progress"></div>
                <div class="percentage" id="percentage">0%</</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize all file upload containers
            initializeFileUpload('single-comparison');
            initializeFileUpload('html-comparison');

            // Enhanced form switch animation
            function showForm(formId) {
                const forms = document.querySelectorAll('.form-container');
                forms.forEach(form => {
                    form.classList.remove('show');
                    setTimeout(() => form.style.display = 'none', 300);
                });

                const selectedForm = document.getElementById(formId);
                setTimeout(() => {
                    selectedForm.style.display = 'block';
                    setTimeout(() => selectedForm.classList.add('show'), 50);
                }, 300);
            }
        });

        function showLoadingOverlay() {
            const loadingOverlay = document.getElementById('loading-overlay');
            const progress = document.getElementById('progress');
            const percentage = document.getElementById('percentage');
            loadingOverlay.style.display = 'flex';
            progress.style.width = '0';
            percentage.textContent = '0%';

            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                } else {
                    width += 1;
                    progress.style.width = width + '%';
                    percentage.textContent = width + '%';
                }
            }, 100);
        }
    </script>
</body>
</html>
